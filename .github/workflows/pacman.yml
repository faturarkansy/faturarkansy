name: Generate arcade animation

on:
  schedule: # Mengeksekusi setiap 12 jam
    - cron: "0 */12 * * *"
  
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab Actions

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Step 1: Membuat file svg animasi pacman
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: faturarkansy
          games: 'pacman'
          theme: 'dark'

      # Step 2: Mengirimkan hasilnya ke branch 'pacman-output'
      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
